# Krea 2 LoRA / ai-toolkit —— 20 张图集示例
# 训练底模：krea/Krea-2-Raw    出图：krea/Krea-2-Turbo（loraforge/models.py:54-55）
#   arch: krea2                  extensions_built_in/diffusion_models/krea2/krea2.py:144-145
#   noise_scheduler flowmatch    krea2.py:201-202
#   timestep_type linear         **绝不能写 sigmoid**，那是 FLUX 的口径，社区反复踩的坑
#   quantize qfloat8             toolkit/models/registry.py:26；qtype 默认 qfloat8（config_modules.py:695-703）
#   diff_output_preservation false  docs/models/krea2.md:222（先跑通再开；开了必须给 trigger_word 且不能开 TE）
#   train_text_encoder false     docs/models/krea2.md:166（Krea2 的 TE 是静默空操作）
#   bucket 能被 16 整除          krea2.py:204-206（VAE 8 × patch 2）
# 采样：Raw 上 52 步 / guidance 4.5（docs/models/krea2.md:224，真生效 CFG = 本值 − 1，UNVERIFIED）；
#       出图验收走 Turbo：8 步 / guidance 1.0（toolkit/models/registry.py:26）
job: extension
config:
  name: krea2-lora-v1
  process:
  - type: sd_trainer
    training_folder: ./output
    device: cuda:0
    trigger_word: mychar
    network:
      type: lora
      linear: 32
      linear_alpha: 32
    save:
      dtype: float16
      save_every: 250
      max_step_saves_to_keep: 4
      push_to_hub: false
    datasets:
    - folder_path: ./datasets/my_character
      caption_ext: txt
      caption_dropout_rate: 0.05
      shuffle_tokens: false
      cache_latents_to_disk: true
      buckets: true
      resolution:
      - 512
      - 768
      - 1024
    train:
      batch_size: 1
      steps: 2500
      gradient_accumulation_steps: 1
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      optimizer: adamw8bit
      lr: 0.0001
      dtype: bf16
      ema_config:
        use_ema: true
        ema_decay: 0.99
      noise_scheduler: flowmatch
      timestep_type: linear
      diff_output_preservation: false
    sample:
      sample_every: 250
      sample_start_step: 0
      width: 1024
      height: 1024
      prompts:
      - '[trigger], portrait photo, plain background, soft lighting'
      - '[trigger] walking through a rainy city street at night, neon signs, full
        body'
      - portrait photo, plain background, soft lighting
      neg: ''
      seed: 42
      walk_seed: false
      sampler: flowmatch
      sample_steps: 52
      guidance_scale: 4.5
    logging:
      log_every: 10
      use_wandb: false
      verbose: false
    model:
      name_or_path: krea/Krea-2-Raw
      arch: krea2
      dtype: bf16
      vae_dtype: float32
      quantize: true
      qtype: qfloat8
      quantize_te: true
      qtype_te: qfloat8
meta:
  name: '[name]'
  version: '1.0'
