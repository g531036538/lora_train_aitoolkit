[project]
name = "loraforge"
version = "0.1.0"
description = "为 SDXL / Krea 2 / MOSS-Image 生成 ai-toolkit LoRA 训练所需的打标词与配置"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
ui = ["gradio>=5.0"]
tagger = ["onnxruntime>=1.18", "huggingface-hub>=0.24", "numpy>=1.26"]
vlm = ["torch>=2.4", "transformers>=4.45", "accelerate>=0.34"]
api = ["requests>=2.31"]
dev = ["pytest>=8.0"]

[project.scripts]
loraforge = "loraforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loraforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
