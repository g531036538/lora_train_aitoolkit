[project]
name = "loraforge"
version = "0.1.0"
description = "为 SDXL / Krea 2 / MOSS-Image 生成 ai-toolkit LoRA 训练所需的打标词与配置"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
# 界面只用本机已预装的 fastapi/uvicorn/jinja2，不需要真的去装；
# 列在这里是为了说明界面依赖边界（界面不许引入 gradio 之类的新框架）。
ui = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]
# 本机没有 onnxruntime，也没有 pip 可装，这两个 extra 目前不可用，仅记录意图。
tagger = ["onnxruntime>=1.18", "huggingface-hub>=0.24", "numpy>=1.26"]
vlm = ["torch>=2.4", "transformers>=4.45", "accelerate>=0.34"]
# 远程打标后端走 HTTP，用已装好的 httpx，不需要 openai SDK。
api = ["httpx>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
loraforge = "loraforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loraforge*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
